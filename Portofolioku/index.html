<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio - Nama Lengkap Anda</title>
<meta name="description" content="Portofolio pribadi: profil, keahlian, pengalaman, proyek, dan video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#12212b;--mute:#5b6b76;--line:#d5dde3;--acc:#1f4fe0;--acc-ink:#fff;--side:#12212b;--side-ink:#e8eef2;--side-mute:#9fb0bb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d151b;--panel:#15212a;--ink:#e8eef2;--mute:#93a4af;--line:#25343f;--acc:#6f93ff;--acc-ink:#0d151b;--side:#15212a;--side-ink:#e8eef2;--side-mute:#93a4af}}
:root[data-theme=dark]{--bg:#0d151b;--panel:#15212a;--ink:#e8eef2;--mute:#93a4af;--line:#25343f;--acc:#6f93ff;--acc-ink:#0d151b;--side:#15212a;--side-ink:#e8eef2;--side-mute:#93a4af}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;line-height:1.15}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{display:grid;grid-template-columns:320px 1fr;min-height:100vh;max-width:1200px;margin:0 auto}
aside{background:var(--side);color:var(--side-ink);padding:40px 28px;position:sticky;top:0;height:100vh;overflow:auto}
.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:800 44px "Bricolage Grotesque",sans-serif;margin-bottom:20px}
aside h1{font-size:30px;font-weight:800}
.role{color:var(--side-mute);margin:6px 0 22px}
.facts{list-style:none;padding:0;display:grid;gap:10px;font-size:15px;margin-bottom:24px}
.facts span{display:block;color:var(--side-mute);font-size:13px}
.social{display:flex;flex-wrap:wrap;gap:8px}
.social a{border:1px solid var(--side-mute);border-radius:99px;padding:6px 14px;font-size:14px;text-decoration:none}
.social a:hover{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tools{margin-top:26px;display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--side-ink);border:1px solid var(--side-mute)}
main{padding:48px 40px;display:grid;gap:56px;align-content:start}
section>h2{font-size:28px;margin-bottom:18px}
.about{font-size:18px;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}
.chips li{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:15px}
.tl{display:grid;gap:22px;border-left:2px solid var(--line);padding-left:22px}
.tl h3{font-size:19px}.tl small{color:var(--mute)}.tl p{max-width:62ch;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .body{padding:14px 16px 18px}.card h3{font-size:18px;margin-bottom:4px}.card p{color:var(--mute);font-size:15px}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;background:#000;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:auto;width:56px;height:40px;background:#e62117;border-radius:11px;display:grid;place-items:center}
.play:after{content:"";border-left:16px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.thumb:hover .play{transform:scale(1.08)}
.tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mute)}
.card a.link{margin-top:10px;display:inline-block;color:var(--acc);font-weight:600}
dialog{border:0;border-radius:12px;padding:0;width:min(900px,94vw);background:#000;overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.x{position:absolute;right:8px;top:8px;z-index:2;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:8px;padding:4px 12px}
footer{color:var(--mute);font-size:14px;padding-top:8px;border-top:1px solid var(--line)}
@media (max-width:820px){.wrap{display:block}aside{position:static;height:auto;padding:32px 22px}main{padding:32px 20px}}
@media print{aside{position:static;height:auto;print-color-adjust:exact}.tools,.thumb .play{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><button class="x" id="close" aria-label="Tutup video">Tutup</button></dialog>

<script>
/* =====================================================
   EDIT BAGIAN INI SAJA. Simpan, lalu unggah ulang file ini.
   ===================================================== */
const DATA = {
  nama: "Yoans Salman",
  profesi: "DEVELOPER HNP STUDIO",
  foto: "fotoku.png",
  tentang: "Pengiat digital di bawah label HNP STUDIO memproduksikan: Tools AI, AI Engineer, Instruktur AI, Software, Pembuatan Film Animasi, Pembuatan Website, & Game.",
  identitas: [
    ["Tempat, tanggal lahir", "Lubuk Linggau, 09 Maret 1983"],
    ["Domisili", "Bengkulu, Indonesia"],
    ["Email", "hijrahnubuwwahproduction@gmail.com"],
    ["Telepon / WhatsApp", "081273335666"]
  ],
  sosmed: [
    ["Instagram", "https://www.instagram.com/hijrahnubuwwahproduction/"],
    ["Facebook", "https://www.facebook.com/studiohnp"],
    ["Tiktok", "https://www.tiktok.com/@hnpstudio1"],
    ["YouTube", "https://www.youtube.com/@hijrahnubuwwahproduction8166"]
  ],
  keahlian: ["Desain Grafis", "Penulisan", "Programer", "Editing Video", "Tentor"],
  pengalaman: [
    { judul: "HNP Studio / Developer", tempat: "Bengkulu", periode: "2025 - sekarang", isi: "Saya pernah bekerja sebagai guru di Ponpes Al Hasanah Pondok Kelapa Bengkulu Utara, pernah mengajar di SDIT Iqra' 2 Kota Bengkulu, pernah bekerja sebagai Akunting Eksekutif Koran Rakyat Bengkulu, Wartawan Koran Rakyat Bengkulu." },
    { judul: "Sarjana S1", tempat: "Universitas Bengkulu", periode: "2002 - 2006", isi: "Pendidikan Bahasa, Sastra Indonesia & Daerah - FKIP" }
  ],
  video: [
    { judul: "EPISODE 1: MERPATIKU", ket: "Film Animasi Edukasi Anak.", url: "https://www.youtube.com/watch?v=eGc9-tstQ64" },
    { judul: "KUNGFU CAI", ket: "Video gendre laga kolosal.", url: "https://youtu.be/COl5TugdsFM?si=Gre57ZVWXz7ukY5Y" },
    { judul: "JASA IKLAN PRODUK", ket: "Desain produk iklan sabun cupir.", url: "https://youtu.be/7ieIjQ9n5hs?si=0D4CozZaHLdeQ6ii" },
    { judul: "JASA PEMBUATAN IKLAN - MI RASA LONTONG TUNJANG", ket: "Desain produk iklan mie.", url: "https://youtu.be/GfKl_bCgR5k?si=G8IwHlmHG1-9nQKf" },
    { judul: "VOICE CLONING", ket: "Mengkloning suara mirip aslinya secara natural.", url: "https://youtu.be/bUGDT0B_V6c?si=D6-AKzHSWBAM6JGF" },
    { judul: "IKLAN OJK", ket: "Iklan kampanye perusahaan.", url: "https://youtu.be/DNDeYCHkbg8?si=3F1Yo2AJLDV2dLi7" },
    { judul: "IKLAN MINUMAN KALENG", ket: "Iklan & desain minuman kaleng.", url: "https://youtu.be/fyjoEBiyOUY?si=GxGJMPDCltZZZKNN" },
    { judul: "Video Viral", ket: "Video viral ala sosmed", url: "https://youtu.be/ynRHbbzqbWg?si=o5lHUcHAAr4a4M6E" },
    { judul: "Keseruan Main Kapal Di Sungai", ket: "Video style short potred rasio 9:16.", url: "https://youtu.be/vccf4-di1gE?si=PHXayFUbXIOP4OdJ" }
  ],
  proyek: [
    { judul: "SOFTWARE TOOLS AI", ket: "Pembuatan berbagai macam tools AI. Dan masih banyak lagi software lainnya.", tags: ["SOFTWARE", "PROGRAMER"], url: "https://lynk.id/hnpstudio/yey7n795ekdd" }
  ]
};
/* ===================================================== */

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe = (u) => /^(https?:|mailto:|tel:)/i.test(u) ? u : "#";
function ytId(url){
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
const initials = DATA.nama.split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();

$("#side").innerHTML = `
  ${DATA.foto ? `<img class="avatar" src="${esc(DATA.foto)}" alt="Foto ${esc(DATA.nama)}">` : `<div class="avatar" aria-hidden="true">${esc(initials)}</div>`}
  <h1>${esc(DATA.nama)}</h1>
  <p class="role">${esc(DATA.profesi)}</p>
  <ul class="facts">${DATA.identitas.map(([k,v]) => `<li><span>${esc(k)}</span>${esc(v)}</li>`).join("")}</ul>
  <div class="social">${DATA.sosmed.map(([n,u]) => `<a href="${esc(safe(u))}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}</div>
  <div class="tools">
    <button class="btn ghost" id="share">Bagikan</button>
    <button class="btn ghost" onclick="print()">Cetak / PDF</button>
  </div>`;

const videoCards = DATA.video.map(v => {
  const id = ytId(v.url); if(!id) return "";
  return `<article class="card">
    <button class="thumb" data-id="${id}" aria-label="Putar video: ${esc(v.judul)}">
      <img loading="lazy" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="Thumbnail ${esc(v.judul)}"><span class="play"></span>
    </button>
    <div class="body"><h3>${esc(v.judul)}</h3><p>${esc(v.ket)}</p></div></article>`;
}).join("");

$("#main").innerHTML = `
  <section><h2>Tentang saya</h2><p class="about">${esc(DATA.tentang)}</p></section>
  <section><h2>Keahlian</h2><ul class="chips">${DATA.keahlian.map(k => `<li>${esc(k)}</li>`).join("")}</ul></section>
  <section><h2>Pengalaman dan pendidikan</h2><div class="tl">${DATA.pengalaman.map(p => `
    <div><h3>${esc(p.judul)}</h3><small>${esc(p.tempat)} &middot; ${esc(p.periode)}</small><p>${esc(p.isi)}</p></div>`).join("")}</div></section>
  ${videoCards ? `<section><h2>Video</h2><div class="grid">${videoCards}</div></section>` : ""}
  ${DATA.proyek.length ? `<section><h2>Proyek</h2><div class="grid">${DATA.proyek.map(p => `
    <article class="card"><div class="body"><h3>${esc(p.judul)}</h3><p>${esc(p.ket)}</p>
    <div class="tags">${(p.tags||[]).map(t => `<span>${esc(t)}</span>`).join("")}</div>
    ${p.url ? `<a class="link" href="${esc(safe(p.url))}" target="_blank" rel="noopener">Lihat proyek</a>` : ""}</div></article>`).join("")}</div></section>` : ""}
  <footer>&copy; ${new Date().getFullYear()} ${esc(DATA.nama)}</footer>`;

document.title = "Portofolio - " + DATA.nama;

/* Pemutar video */
const dlg = $("#dlg");
document.addEventListener("click", (e) => {
  const b = e.target.closest(".thumb");
  if(b){ const f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${b.dataset.id}?autoplay=1&rel=0`;
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true; f.title = "Video YouTube";
    dlg.querySelector("iframe")?.remove(); dlg.append(f); dlg.showModal(); }
});
const stop = () => dlg.querySelector("iframe")?.remove();
$("#close").onclick = () => dlg.close();
dlg.addEventListener("close", stop);
dlg.addEventListener("click", (e) => { if(e.target === dlg) dlg.close(); });

/* Tombol bagikan */
$("#share").onclick = async () => {
  const data = { title: document.title, url: location.href };
  try { if(navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); $("#share").textContent = "Tautan disalin"; } }
  catch(_) { prompt("Salin tautan ini:", location.href); }
};
</script>
</body>
</html>
